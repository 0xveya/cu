<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cu</title>
<style>
:root{color-scheme:dark;font:13px system-ui,sans-serif;background:#000;color:#fff}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:8px;align-items:center;padding:8px}select,button{font:inherit;color:#fff;background:#000;border:1px solid #444;border-radius:3px;padding:4px 8px}button{cursor:pointer}button[aria-pressed=true]{border-color:#ff8ac8;color:#ff8ac8}select:focus-visible,button:focus-visible{outline:1px solid #ff8ac8;outline-offset:2px}#stage{flex:1;min-height:0;position:relative;outline:0}#screen{position:absolute;width:100%;height:100%;object-fit:contain;user-select:none}#error{color:#ff8ac8;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}img[hidden]{display:none}
</style>
<header><select id="sessions" aria-label="Desktop"></select><button id="attach" type="button" aria-pressed="false" title="Attach keyboard and mouse">Attach</button><span id="error" role="alert"></span></header>
<div id="stage" tabindex="0" aria-label="Desktop"><img id="screen" alt="" draggable="false" hidden></div>
<script>
'use strict';
const base=location.pathname,select=document.querySelector('#sessions'),attach=document.querySelector('#attach'),stage=document.querySelector('#stage'),screen=document.querySelector('#screen'),error=document.querySelector('#error');
let selected=decodeURIComponent(location.hash.slice(1)),sessions=[],attached=false,pending=false,objectURL='',generation=0,drag=null,queue=[],sending=false;
function fail(message){error.textContent=message;}
function updateAttach(){attach.setAttribute('aria-pressed',String(attached));attach.disabled=pending||!sessions.some(item=>item.id===selected&&item.running);}
function choose(id){const previous=selected,detach=attached||pending;queue=[];attached=false;pending=detach;drag=null;if(detach&&previous)queue.push({id:previous,endpoint:'attach',action:{attached:false}});selected=id;generation++;screen.hidden=true;location.hash=id;fail('');updateAttach();send();}
select.onchange=()=>choose(select.value);
attach.onclick=()=>{if(pending)return;const desired=!attached;pending=true;attached=false;drag=null;if(!desired)queue=[];queue.push({id:selected,endpoint:'attach',action:{attached:desired}});updateAttach();send();};
async function updateSessions(){try{const response=await fetch(base+'sessions');if(!response.ok)throw new Error(await response.text());sessions=await response.json();if(!sessions.some(item=>item.id===selected)){choose(sessions.find(item=>item.running)?.id||'');}select.replaceChildren();for(const item of sessions){const option=document.createElement('option');option.value=item.id;option.textContent=item.id;option.disabled=!item.running;select.append(option);}select.value=selected;updateAttach();}catch(e){fail(e.message);}finally{setTimeout(updateSessions,2000);}}
async function updateFrame(){const id=selected,current=generation;try{if(document.hidden||!id||!sessions.some(item=>item.id===id&&item.running))return;const response=await fetch(base+'frame/'+encodeURIComponent(id));if(!response.ok)throw new Error(await response.text());const blob=await response.blob();if(current!==generation)return;const next=URL.createObjectURL(blob);try{await new Promise((resolve,reject)=>{const image=new Image();image.onload=resolve;image.onerror=()=>reject(new Error('Could not decode frame'));image.src=next;});if(current!==generation)return;screen.src=next;screen.hidden=false;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=next;}finally{if(objectURL!==next)URL.revokeObjectURL(next);}}catch(e){if(current===generation)fail(e.message);}finally{setTimeout(updateFrame,document.hidden?500:100);}}
function point(event,clamp=false){if(screen.hidden||!screen.naturalWidth)return null;const rect=screen.getBoundingClientRect(),scale=Math.min(rect.width/screen.naturalWidth,rect.height/screen.naturalHeight),width=screen.naturalWidth*scale,height=screen.naturalHeight*scale,left=rect.left+(rect.width-width)/2,top=rect.top+(rect.height-height)/2;let x=(event.clientX-left)/scale,y=(event.clientY-top)/scale;if(!clamp&&(x<0||y<0||x>=screen.naturalWidth||y>=screen.naturalHeight))return null;x=Math.max(0,Math.min(screen.naturalWidth-1,Math.floor(x)));y=Math.max(0,Math.min(screen.naturalHeight-1,Math.floor(y)));return{x,y};}
function enqueue(action){if(!selected)return;const item={id:selected,endpoint:'input',action};const last=queue[queue.length-1];if(action.kind==='pointer'&&action.pointer.kind==='move'&&last?.id===selected&&last.endpoint==='input'&&last.action.kind==='pointer'&&last.action.pointer.kind==='move'){queue[queue.length-1]=item;}else queue.push(item);send();}
async function send(){if(sending)return;sending=true;try{while(queue.length){const item=queue.shift();try{const response=await fetch(base+item.endpoint+'/'+encodeURIComponent(item.id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item.action)});if(!response.ok)throw new Error(await response.text());if(item.endpoint==='attach'){pending=false;if(item.id===selected){attached=item.action.attached;if(attached)stage.focus();}updateAttach();}fail('');}catch(e){fail(e.message);queue=[];attached=false;pending=false;updateAttach();drag=null;}}}finally{sending=false;}}
const buttons=['left','middle','right'];
stage.onpointerdown=event=>{if(!attached||event.button>2)return;const p=point(event);if(!p)return;event.preventDefault();stage.focus();stage.setPointerCapture(event.pointerId);drag={id:selected,button:buttons[event.button],last:p};enqueue({kind:'pointer',pointer:{kind:'press',...p,button:drag.button}});};
stage.onpointermove=event=>{if(!attached)return;const p=point(event,Boolean(drag));if(!p)return;if(drag)drag.last=p;enqueue({kind:'pointer',pointer:{kind:'move',...p}});};
stage.onpointerup=event=>{if(!drag)return;event.preventDefault();const held=drag;drag=null;const p=point(event,true)||held.last;if(held.id!==selected)return;if(stage.hasPointerCapture(event.pointerId))stage.releasePointerCapture(event.pointerId);enqueue({kind:'pointer',pointer:{kind:'release',...p,button:held.button}});};
stage.onpointercancel=()=>{if(drag){enqueue({kind:'pointer',pointer:{kind:'release',...drag.last,button:drag.button}});drag=null;}};
stage.oncontextmenu=event=>{if(attached)event.preventDefault();};
stage.addEventListener('wheel',event=>{if(!attached)return;const p=point(event);if(!p)return;event.preventDefault();const factor=event.deltaMode===1?20:event.deltaMode===2?screen.naturalHeight:1;const delta_x=Math.max(-10000,Math.min(10000,Math.round(event.deltaX*factor))),delta_y=Math.max(-10000,Math.min(10000,Math.round(event.deltaY*factor)));if(delta_x||delta_y)enqueue({kind:'pointer',pointer:{kind:'scroll',...p,delta_x,delta_y}});},{passive:false});
const keys={Enter:'Return',Backspace:'BackSpace',ArrowLeft:'Left',ArrowRight:'Right',ArrowUp:'Up',ArrowDown:'Down',Escape:'Escape',Tab:'Tab',Delete:'Delete',Home:'Home',End:'End',PageUp:'Page_Up',PageDown:'Page_Down',Insert:'Insert',' ':'space'};
stage.onkeydown=event=>{if(!attached||event.isComposing)return;const altGraph=event.getModifierState('AltGraph');if(!altGraph&&(event.ctrlKey||event.metaKey)&&!event.altKey&&event.key.toLowerCase()==='v')return;event.preventDefault();if(['Control','Shift','Alt','Meta','AltGraph','CapsLock'].includes(event.key))return;if(Array.from(event.key).length===1&&(altGraph||(!event.ctrlKey&&!event.altKey&&!event.metaKey))){enqueue({kind:'text',text:event.key});return;}const modifiers=[];if(event.ctrlKey)modifiers.push('ctrl');if(event.altKey)modifiers.push('alt');if(event.shiftKey)modifiers.push('shift');if(event.metaKey)modifiers.push('logo');const key=keys[event.key]||(Array.from(event.key).length===1?event.key.toLowerCase():/^F\d{1,2}$/.test(event.key)?event.key:'');if(key)enqueue({kind:'key',key:[...modifiers,key].join('+')});};
stage.addEventListener('paste',event=>{if(!attached)return;event.preventDefault();const text=event.clipboardData?.getData('text/plain');if(text)enqueue({kind:'text',text});});
stage.addEventListener('compositionend',event=>{if(attached&&event.data)enqueue({kind:'text',text:event.data});});
updateSessions();updateFrame();
</script>
</html>
