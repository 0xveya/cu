[tools]
go = "1.26.5"
golangci-lint = "2.10.1"
"go:golang.org/x/tools/cmd/goimports" = "0.42.0"
"go:mvdan.cc/gofumpt" = "0.9.2"

[tasks."fmt:go"]
description = "Format Go code"
run = ["goimports -w cmd internal", "gofumpt -w cmd internal", "go mod tidy"]

[tasks."lint:go"]
description = "Lint Go code"
run = "golangci-lint run -c .golangci.yml"

[tasks."test:go"]
description = "Test Go code"
run = "go test ./..."

[tasks.build]
description = "Build cu"
run = "go build -o bin/cu ./cmd/cu"

[tasks.run]
description = "Run cu with arguments after --"
run = "go run ./cmd/cu"

[tasks.demo]
description = "Run a short headless desktop demo and save a screenshot"
depends = ["build"]
run = "./examples/demo.sh"
